name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: windows
            goarch: amd64
            ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Go module checksums
        run: go mod tidy
      - name: Build web
        working-directory: web
        run: npm install --no-audit --no-fund && npm run build
      - name: Build package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="sego-server_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "package/bin" "package/web" dist
          EXE=""; [[ "$GOOS" == windows ]] && EXE=".exe"
          LDFLAGS="-s -w -X github.com/nadeemmhdm/sego-server/internal/version.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o "package/bin/sego-server${EXE}" ./cmd/server
          go build -trimpath -ldflags "$LDFLAGS" -o "package/bin/sego${EXE}" ./cmd/sego
          go build -trimpath -ldflags "$LDFLAGS" -o "package/bin/sego-updater${EXE}" ./cmd/updater
          cp -a web/dist/. package/web/
          if [[ "$GOOS" == windows ]]; then
            (cd package && zip -qr "../dist/${PKG}.zip" .)
          else
            tar -C package -czf "dist/${PKG}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: (cd dist && sha256sum sego-server_* > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "SEGO Server $GITHUB_REF_NAME"
