name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Resolve module checksums
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: |
          go build ./cmd/server
          go build ./cmd/sego
          go build ./cmd/updater

  frontend:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: web
        run: npm run build

  installer-syntax:
    name: Installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n install.sh scripts/install.sh scripts/uninstall.sh scripts/bootstrap.sh scripts/install-update-service.sh
      - name: PowerShell parser
        shell: pwsh
        run: |
          $files = @('install.ps1','scripts/install.ps1','scripts/uninstall.ps1','scripts/bootstrap.ps1','scripts/install-update-service.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          }
